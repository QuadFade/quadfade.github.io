<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuadFade - Modern Web Solutions</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="EQRPGWebHelper.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <!-- Hamburger Menu Toggle -->
    <button class="hamburger-menu" id="hamburger-toggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Side Menu Panel -->
    <div class="menu-overlay" id="menu-overlay"></div>
    <nav class="menu-panel" id="menu-panel">
        <div class="menu-header">
            <h2>Menu</h2>
            <button class="menu-close" id="menu-close" aria-label="Close menu">&times;</button>
        </div>
        <div class="menu-grid">
            <a href="/#inventory" class="menu-button" data-icon="📦">
               <span class="menu-icon">📦</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#character" class="menu-button" data-icon="👤">
               <span class="menu-icon">👤</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#stats" class="menu-button" data-icon="📊">
               <span class="menu-icon">📊</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#skills" class="menu-button" data-icon="⚔️">
               <span class="menu-icon">⚔️</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#professions" class="menu-button" data-icon="🛠️">
               <span class="menu-icon">🛠️</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#settings" class="menu-button" data-icon="⚙️">
               <span class="menu-icon">⚙️</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#quests" class="menu-button" data-icon="🗺️">
               <span class="menu-icon">🗺️</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#achievements" class="menu-button" data-icon="🏆">
               <span class="menu-icon">🏆</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#codex" class="menu-button" data-icon="📖">
               <span class="menu-icon">📖</span>
               <span class="menu-label">Coming Soon</span>
            </a>
            <a href="/#sandbox" class="menu-button" data-icon="🧪">
               <span class="menu-icon">🧪</span>
               <span class="menu-label">Mai Sandbox</span>
            </a>
        </div>
    </nav>

    <div id="app"></div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Menu toggle functionality
        const hamburgerToggle = document.getElementById('hamburger-toggle');
        const menuPanel = document.getElementById('menu-panel');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuClose = document.getElementById('menu-close');

        function toggleMenu() {
            menuPanel.classList.toggle('active');
            menuOverlay.classList.toggle('active');
            document.body.style.overflow = menuPanel.classList.contains('active') ? 'hidden' : '';
        }

        hamburgerToggle.addEventListener('click', toggleMenu);
        menuClose.addEventListener('click', toggleMenu);
        menuOverlay.addEventListener('click', toggleMenu);

        // Close menu when a menu button is clicked
        document.querySelectorAll('.menu-button').forEach(button => {
            button.addEventListener('click', function(e) {
               // Don't close if it's the close button
               if (!e.target.closest('.menu-close')) {
                    toggleMenu();
                    console.log('Menu item clicked:', this.dataset.icon);
                }
            });
        });
    </script>
</body>

</html>
